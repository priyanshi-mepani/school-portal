<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - School Portal</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
min-height:100vh;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 8%;
background:#2c3e50;
}

nav h2{
color:white;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-size:14px;
}

nav a:hover{
text-decoration:underline;
}

/* CENTER PAGE */

.page-wrapper{
display:flex;
justify-content:center;
align-items:center;
min-height:calc(100vh - 70px);
}

.login-container{
background-color:white;
padding:2.5rem;
border-radius:12px;
box-shadow:0 10px 40px rgba(0,0,0,0.2);
width:380px;
}

.login-header{
text-align:center;
margin-bottom:2rem;
}

.login-header h2{
color:#333;
margin-bottom:0.5rem;
}

.login-type{
color:#666;
font-size:14px;
}

.form-group{
margin-bottom:1.25rem;
}

label{
display:block;
margin-bottom:0.5rem;
color:#555;
font-weight:500;
}

select,input{
width:100%;
padding:12px 15px;
border:2px solid #e1e5eb;
border-radius:8px;
font-size:14px;
transition:border-color 0.3s;
}

select:focus,input:focus{
outline:none;
border-color:#667eea;
}

.btn-login{
width:100%;
padding:14px;
background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:transform 0.2s,box-shadow 0.2s;
}

.btn-login:hover{
transform:translateY(-2px);
box-shadow:0 5px 20px rgba(102,126,234,0.4);
}

.error-message{
background-color:#fee2e2;
color:#dc2626;
padding:12px;
border-radius:8px;
margin-top:1rem;
text-align:center;
display:none;
font-size:14px;
}

.footer{
margin-top:1.5rem;
text-align:center;
font-size:12px;
color:#999;
}

/* REGISTER LINK */

.register-link{
margin-top:12px;
text-align:center;
font-size:14px;
}

.register-link a{
color:#667eea;
text-decoration:none;
font-weight:500;
}

.register-link a:hover{
text-decoration:underline;
}

/* Admin vs Student color */

.login-container.admin{
border-top:4px solid #dc2626;
}

.login-container.student{
border-top:4px solid #16a34a;
}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav>
<h2>Student Portal</h2>

<div>
<a href="home.html">Home</a>
<a href="courses.html">Courses</a>
<a href="apply.html">How to Apply</a>
<a href="contact.html">Contact Us</a>
<a href="login.html">Login / Dashboard</a>
</div>
</nav>

<div class="page-wrapper">

<div class="login-container student" id="loginContainer">

<div class="login-header">
<h2 id="headerTitle">Student Login</h2>
<p class="login-type" id="loginType">Please select your login type</p>
</div>

<form id="loginForm">

<div class="form-group">
<label for="loginTypeSelect">Login As</label>
<select id="loginTypeSelect" onchange="updateLoginType()">
<option value="student">Student</option>
<option value="admin">Administrator</option>
</select>
</div>

<div class="form-group">
<label for="email" id="emailLabel">Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>
</div>

<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" placeholder="Enter your password" required>
</div>

<button type="submit" class="btn-login">Login</button>

<div class="error-message" id="errorMessage"></div>

<!-- REGISTER LINK ADDED -->

<div class="register-link">
<p>Don't have an account? <a href="register.html">Register here</a></p>
</div>

</form>

<div class="footer">
<p id="footerText">Forgot your password? Contact your administrator.</p>
</div>

</div>

</div>

<script>

function updateLoginType(){
const loginType=document.getElementById('loginTypeSelect').value;
const container=document.getElementById('loginContainer');
const headerTitle=document.getElementById('headerTitle');
const emailLabel=document.getElementById('emailLabel');
const errorMessage=document.getElementById('errorMessage');

errorMessage.style.display='none';

if(loginType==='admin'){
container.className='login-container admin';
headerTitle.textContent='Administrator Login';
emailLabel.textContent='Admin Email';
}else{
container.className='login-container student';
headerTitle.textContent='Student Login';
emailLabel.textContent='Student Email';
}
}

updateLoginType();

document.getElementById('loginForm').addEventListener('submit',async function(e){

e.preventDefault();

const role=document.getElementById('loginTypeSelect').value;
const email=document.getElementById('email').value;
const password=document.getElementById('password').value;
const errorMessage=document.getElementById('errorMessage');

try{

const response=await fetch('login.php',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({role,email,password})
});

const rawText=await response.text();
const data=JSON.parse(rawText);

if(response.ok){

if(role==='admin'){
window.location.href='dashboard.php';
}else{
window.location.href='courses.html';
}

}else{

errorMessage.textContent=data.error;
errorMessage.style.display='block';

}

}catch(error){

errorMessage.textContent='A background error occurred.';
errorMessage.style.display='block';

}

});

</script>

</body>
</html>
